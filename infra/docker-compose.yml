# Local development database only: bound to 127.0.0.1, password for this machine only.
#   docker compose -f infra/docker-compose.yml up -d
#   DATABASE_URL=postgresql+psycopg://fbgc:fbgc-local-only@127.0.0.1:5433/fbgc
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fbgc
      POSTGRES_PASSWORD: fbgc-local-only
      POSTGRES_DB: fbgc
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fbgc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbgc -d fbgc"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fbgc-postgres:
