[project]
name = "fbgc-core"
version = "0.1.0"
description = "Settings and feature catalogue for facebook-gender-classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbgc_core"]
