[project]
name = "fbgc-pipeline"
version = "0.1.0"
description = "Extraction pipeline for facebook-gender-classifier (runs on the private zone only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fbgc-core",
  "lxml>=5.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "pyreadr>=0.5",
  "pyyaml>=6.0",
  "typer>=0.15",
]

[project.scripts]
fbgc = "fbgc_pipeline.cli:app"

[tool.uv.sources]
fbgc-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbgc_pipeline"]
